<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Fallback redirect to React application -->
  <script>
    (function() {
      var file = window.location.pathname.split('/').pop().replace('.html', '');
      var targetRoute = file ? ('/' + file) : '/dashboard';
      window.location.replace(targetRoute + window.location.search + window.location.hash);
    })();
  </script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover Books — BOOK FORGE</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-auth-required="true">
<a href="#mainContent" class="skip-link">Skip to main content</a>

<div class="app-shell">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar"></aside>

  <!-- MAIN CONTENT -->
  <main class="main-content" id="mainContent">
    <div class="topbar">
      <!-- Rendered by BookClubUI.renderTopbar -->
    </div>

    <!-- ADVANCED FILTER & SEARCH BAR -->
    <div class="filter-bar">
      <div class="search-box" style="flex: 2; min-width: 250px;">
        <span>🔎</span>
        <input type="text" id="bookSearchInput" placeholder="Search by book title, author, or keywords..." data-i18n-placeholder="topbar.searchPlaceholder">
      </div>

      <select id="genreFilter">
        <option value="all" data-i18n="books.allGenres">All Genres</option>
        <option value="Fiction" data-i18n="books.genreFiction">Fiction</option>
        <option value="Historical Fiction" data-i18n="books.genreHistorical">Historical Fiction</option>
        <option value="Mystery" data-i18n="books.genreMystery">Mystery</option>
        <option value="Fantasy" data-i18n="books.genreFantasy">Fantasy</option>
        <option value="Non-Fiction" data-i18n="books.genreNonFiction">Non-Fiction</option>
        <option value="Classic" data-i18n="books.genreClassic">Classic Literature</option>
        <option value="Philosophy" data-i18n="books.genrePhilosophy">Philosophy</option>
        <option value="Sci-Tech" data-i18n="books.genreSciTech">Science & Technology</option>
      </select>

      <select id="ratingFilter">
        <option value="0" data-i18n="books.anyRating">Any Rating</option>
        <option value="4.5">★ 4.5 & up</option>
        <option value="4.0">★ 4.0 & up</option>
        <option value="3.5">★ 3.5 & up</option>
      </select>

      <select id="pageFilter">
        <option value="all" data-i18n="books.anyLength">Any Length</option>
        <option value="short" data-i18n="books.shortPages">&lt; 300 pages</option>
        <option value="medium" data-i18n="books.mediumPages">300 - 450 pages</option>
        <option value="long" data-i18n="books.longPages">&gt; 450 pages</option>
      </select>

      <select id="sortSelect">
        <option value="popular" data-i18n="books.mostPopular">Sort: Most Popular</option>
        <option value="rating" data-i18n="books.highestRated">Sort: Highest Rated</option>
        <option value="newest" data-i18n="books.newest">Sort: Newest</option>
        <option value="reviews" data-i18n="books.mostReviewed">Sort: Most Reviewed</option>
        <option value="title" data-i18n="books.titleAZ">Sort: Title A–Z</option>
      </select>

      <button type="button" class="btn btn-ghost btn-sm" id="resetFiltersBtn" data-i18n="books.reset">Reset</button>
    </div>

    <!-- STATUS TABS: ALL / AVAILABLE / LOCKED REWARDS -->
    <div class="catalog-status-tabs" id="catalogStatusTabs">
      <button type="button" class="status-pill-tab active" data-status="all">📚 All Catalog</button>
      <button type="button" class="status-pill-tab" data-status="available">🔓 Available Books</button>
      <button type="button" class="status-pill-tab" data-status="locked">🔒 Quest Rewards Vault</button>
    </div>

    <!-- RESULTS METRIC STRIP -->
    <div class="flex-between mb-30" style="padding: 0 4px;">
      <span class="text-soft" id="catalogResultsCount">Showing 18 books</span>
      <div class="flex gap-12" style="font-size: 0.85rem; color: var(--ink-soft);">
        <span data-i18n="books.tip">Tip: Click on a book cover to open in-depth discussions & reader notes</span>
      </div>
    </div>

    <!-- BOOK GRID -->
    <div class="grid grid-4" id="booksCatalogGrid">
      <!-- Rendered dynamically -->
    </div>

  </main>
</div>

<!-- Scripts -->
<script src="js/data/books.js"></script>
<script src="js/data/users.js"></script>
<script src="js/data/groups.js"></script>
<script src="js/data/events.js"></script>
<script src="js/data/challenges.js"></script>
<script src="js/data/competitions.js"></script>
<script src="js/data/reviews.js"></script>
<script src="js/data/discussions.js"></script>
<script src="js/data/goals.js"></script>
<script src="js/data/notes.js"></script>
<script src="js/data/journal.js"></script>
<script src="js/data/notifications.js"></script>
<script src="js/data/activities.js"></script>
<script src="js/data/leaderboards.js"></script>
<script src="js/data/reports.js"></script>
<script src="js/api.js"></script>
<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script src="js/i18n.js"></script>
<script src="js/components.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  BookClubAuth.requireAuth();

  BookClubUI.renderSidebar('books');
  function updateTopbar() {
    const title = (typeof BookForgeI18n !== 'undefined' && BookForgeI18n.t) ? BookForgeI18n.t('books.title', 'Book Discovery') : 'Book Discovery';
    const sub = (typeof BookForgeI18n !== 'undefined' && BookForgeI18n.t) ? BookForgeI18n.t('books.subtitle', 'Browse our curated catalog, filter by genre or pacing, and add books to your personal shelf.') : 'Browse our curated catalog, filter by genre or pacing, and add books to your personal shelf.';
    const myLib = (typeof BookForgeI18n !== 'undefined' && BookForgeI18n.t) ? BookForgeI18n.t('books.myLibrary', 'My Library Shelves 📚') : 'My Library Shelves 📚';
    BookClubUI.renderTopbar(
      title,
      sub,
      `<a href="library.html" class="btn btn-outline btn-sm">${myLib}</a>`
    );
  }
  updateTopbar();

  const searchInput = document.getElementById('bookSearchInput');
  const genreFilter = document.getElementById('genreFilter');
  const ratingFilter = document.getElementById('ratingFilter');
  const pageFilter = document.getElementById('pageFilter');
  const sortSelect = document.getElementById('sortSelect');
  const resetBtn = document.getElementById('resetFiltersBtn');
  const grid = document.getElementById('booksCatalogGrid');
  const countLabel = document.getElementById('catalogResultsCount');

  // Check URL query parameters for pre-selected genre or search
  const params = new URLSearchParams(window.location.search);
  if (params.get('genre')) genreFilter.value = params.get('genre');
  if (params.get('search')) searchInput.value = params.get('search');

  function renderCatalog() {
    const allBooks = BookClubStore.getBooks();
    const query = searchInput.value.trim().toLowerCase();
    const genre = genreFilter.value;
    const minRating = Number(ratingFilter.value) || 0;
    const pageLength = pageFilter.value;
    const sortBy = sortSelect.value;
    const activeTab = (document.querySelector('.status-pill-tab.active') || {}).dataset?.status || 'all';

    let filtered = allBooks.filter(b => {
      // Status (All / Available / Locked)
      const isLocked = BookClubStore.isBookLocked(b.id);
      let matchesStatus = true;
      if (activeTab === 'available') matchesStatus = !isLocked;
      else if (activeTab === 'locked') matchesStatus = isLocked;

      // Search matches title, Tamil title, author, Tamil author, or genre
      const matchesSearch = !query ||
        (b.title && b.title.toLowerCase().includes(query)) ||
        (b.title_ta && b.title_ta.toLowerCase().includes(query)) ||
        (b.author && b.author.toLowerCase().includes(query)) ||
        (b.author_ta && b.author_ta.toLowerCase().includes(query)) ||
        (b.genre && b.genre.toLowerCase().includes(query)) ||
        (b.genre_ta && b.genre_ta.toLowerCase().includes(query));

      // Genre
      const matchesGenre = (genre === 'all') || (b.genre.toLowerCase() === genre.toLowerCase());

      // Rating
      const matchesRating = (b.rating >= minRating);

      // Page Count
      let matchesPages = true;
      if (pageLength === 'short') matchesPages = b.totalPages < 300;
      else if (pageLength === 'medium') matchesPages = b.totalPages >= 300 && b.totalPages <= 450;
      else if (pageLength === 'long') matchesPages = b.totalPages > 450;

      return matchesStatus && matchesSearch && matchesGenre && matchesRating && matchesPages;
    });

    // Sort
    if (sortBy === 'popular') {
      filtered.sort((a, b) => (b.popular === a.popular) ? b.rating - a.rating : (b.popular ? 1 : -1));
    } else if (sortBy === 'rating') {
      filtered.sort((a, b) => b.rating - a.rating);
    } else if (sortBy === 'newest') {
      filtered.sort((a, b) => b.publicationYear - a.publicationYear);
    } else if (sortBy === 'reviews') {
      filtered.sort((a, b) => b.reviewCount - a.reviewCount);
    } else if (sortBy === 'title') {
      filtered.sort((a, b) => {
        const titleA = (typeof BookForgeI18n !== 'undefined') ? BookForgeI18n.getBookText(a, 'title') : a.title;
        const titleB = (typeof BookForgeI18n !== 'undefined') ? BookForgeI18n.getBookText(b, 'title') : b.title;
        return titleA.localeCompare(titleB);
      });
    }

    const currentLang = (typeof BookForgeI18n !== 'undefined') ? BookForgeI18n.getLanguage() : 'en';
    if (currentLang === 'ta') {
      countLabel.textContent = `${allBooks.length} புத்தகங்களில் ${filtered.length} காட்டப்படுகிறது`;
    } else if (currentLang === 'hi') {
      countLabel.textContent = `${allBooks.length} किताबों में से ${filtered.length} दिखाई जा रही हैं`;
    } else if (currentLang === 'es') {
      countLabel.textContent = `Mostrando ${filtered.length} de ${allBooks.length} libros`;
    } else if (currentLang === 'fr') {
      countLabel.textContent = `Affichage de ${filtered.length} sur ${allBooks.length} livres`;
    } else if (currentLang === 'de') {
      countLabel.textContent = `Zeige ${filtered.length} von ${allBooks.length} Büchern`;
    } else {
      countLabel.textContent = `Showing ${filtered.length} of ${allBooks.length} books`;
    }

    if (filtered.length === 0) {
      grid.innerHTML = `
        <div style="grid-column: 1 / -1;">
          ${BookClubUI.renderEmptyState('🔍', 'No matching books found', 'Try adjusting your genre, length filters, or search term.', 'Reset All Filters', '#')}
        </div>
      `;
      const emptyReset = grid.querySelector('.btn-primary');
      if (emptyReset) {
        emptyReset.addEventListener('click', (e) => {
          e.preventDefault();
          resetAll();
        });
      }
      return;
    }

    grid.innerHTML = filtered.map(b => BookClubUI.renderBookCard(b)).join('');
  }

  function resetAll() {
    searchInput.value = '';
    genreFilter.value = 'all';
    ratingFilter.value = '0';
    pageFilter.value = 'all';
    sortSelect.value = 'popular';
    document.querySelectorAll('.status-pill-tab').forEach(t => t.classList.remove('active'));
    document.querySelector('.status-pill-tab[data-status="all"]')?.classList.add('active');
    renderCatalog();
  }

  document.querySelectorAll('.status-pill-tab').forEach(tab => {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.status-pill-tab').forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      renderCatalog();
    });
  });

  searchInput.addEventListener('input', renderCatalog);
  genreFilter.addEventListener('change', renderCatalog);
  ratingFilter.addEventListener('change', renderCatalog);
  pageFilter.addEventListener('change', renderCatalog);
  sortSelect.addEventListener('change', renderCatalog);
  resetBtn.addEventListener('click', resetAll);

  // Re-render immediately on platform language change
  window.addEventListener('bookforge_lang_change', () => {
    updateTopbar();
    renderCatalog();
    if (typeof BookForgeI18n !== 'undefined') {
      BookForgeI18n.applyTranslations();
    }
  });

  // Handle click on book cards, details buttons, and covers to navigate with ID
  grid.addEventListener('click', (e) => {
    // Ignore clicks on favorite heart button or shelf dropdown menu/buttons
    if (e.target.closest('.book-fav-btn') || e.target.closest('.shelf-dropdown-wrap')) {
      return;
    }
    const card = e.target.closest('.book-card');
    if (card) {
      const bookId = card.getAttribute('data-book-id');
      if (bookId) {
        try {
          sessionStorage.setItem('selectedBookId', bookId);
          localStorage.setItem('selectedBookId', bookId);
        } catch (err) {}
        if (!e.target.closest('a')) {
          window.location.href = `book-details.html?id=${bookId}`;
        }
      }
    }
  });

  // Initial render
  renderCatalog();
});
</script>
</body>
</html>
